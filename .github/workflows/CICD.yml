# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Pipeline Unificado de CI/CD - Estabilidad, Gobernanza y Escalabilidad

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

jobs:
  integration-and-testing:
    name: 🧪 Integración y Pruebas
    runs-on: ubuntu-latest

    services:
      db_mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: db_ejemplo
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar JDK 26
        uses: actions/setup-java@v4
        with:
          java-version: '26'
          distribution: 'temurin'
          cache: 'maven'

      - name: Ejecutar Pruebas Automatizadas (Unitarias e Integración)
        run: mvn clean verify
        env:
          SPRING_DATASOURCE_URL: jdbc:mysql://localhost:3306/db_ejemplo
          SPRING_DATASOURCE_USERNAME: root
          SPRING_DATASOURCE_PASSWORD: root

  security-and-delivery:
    name: 🛡️ Seguridad y Despliegue
    runs-on: ubuntu-latest
    needs: integration-and-testing
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar JDK 26 (Para SonarQube)
        uses: actions/setup-java@v4
        with:
          java-version: '26'
          distribution: 'temurin'
          cache: 'maven'

      - name: Analizar Calidad de Código (SAST - SonarQube)
        run: |
          mvn sonar:sonar \
            -Dsonar.qualitygate.wait=true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      - name: Construir Imagen Docker de la Aplicación
        run: docker build -t mi-registro.com/Ejemplo:${{ github.sha }} .

      - name: Escaneo de Vulnerabilidades en Contenedores (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'mi-registro.com/Ejemplo:${{ github.sha }}'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Autenticación Segura en el Registro de la Nube
        uses: docker/login-action@v3
        with:
          registry: mi-registro.com
          username: ${{ secrets.CLOUD_REGISTRY_USER }}
          password: ${{ secrets.CLOUD_REGISTRY_TOKEN }}

      - name: Subir Imagen Verificada al Registro (Push)
        run: docker push mi-registro.com/Ejemplo:${{ github.sha }}

      - name: Desplegar en Cluster de Producción (Kubernetes con Escalabilidad)
        run: |
          kubectl apply -f k8s/deployment.yml
          kubectl apply -f k8s/hpa.yml