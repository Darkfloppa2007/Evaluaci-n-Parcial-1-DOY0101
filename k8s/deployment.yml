apiVersion: apps/v1
kind: Deployment
metadata:
  name: Ejemplo-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: Ejemplo
  template:
    metadata:
      labels:
        app: Ejemplo
    spec:
      containers:
        - name: Ejemplo-app
          image: mi-registro.com/Ejemplo:latest
          ports:
            - containerPort: 8080
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10